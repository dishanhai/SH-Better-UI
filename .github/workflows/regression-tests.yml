name: Test SH-Better-UI (Regression)

on:
  workflow_dispatch:
  # Validate changes to the test infrastructure without duplicating every Push build.
  push:
    branches: ['**']
    paths:
      - .github/workflows/regression-tests.yml
      - scripts/ci-build.sh
      - scripts/ci-test-report.py
      - scripts/test-custom-font-pack.py
      - bridge/**
      - web/tests/**

permissions:
  contents: read

concurrency:
  group: regression-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.platform }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: forge-1.20.1
            project: .
            gradle: '8.8'
            java: '21'
          - platform: neoforge-1.21.1
            project: neoforge-1.21.1
            worker-xml: uuk-script-worker/build/test-results/**/TEST-*.xml
            worker-html: uuk-script-worker/build/reports/tests/**
            gradle: '9.2.1'
            java: '21'
          - platform: neoforge-26.1.2
            project: neoforge-26.1.2
            gradle: '9.2.1'
            java: '25'
          - platform: neoforge-26.2
            project: neoforge-26.2
            gradle: '9.2.1'
            java: '25'
          - platform: server-bridge
            project: bridge
            gradle: '9.2.1'
            java: '21'

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Java 17 and 21 toolchains
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: |
            17
            21
          cache: gradle
          cache-dependency-path: |
            **/*.gradle
            **/gradle.properties
            .github/workflows/regression-tests.yml
            scripts/ci-build.sh

      - name: Set up Java 25 for NeoForge 26
        if: matrix.java == '25'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Run all JVM suites without packaging a mod JAR
        env:
          GRADLE_VERSION: ${{ matrix.gradle }}
          PROJECT_DIR: ${{ matrix.project }}
        run: bash scripts/ci-build.sh "$GRADLE_VERSION" "$PROJECT_DIR" test

      - name: Print JVM regression counts and failure details
        if: ${{ !cancelled() }}
        env:
          PROJECT_DIR: ${{ matrix.project }}
        run: |
          args=("$PROJECT_DIR")
          if [[ "$PROJECT_DIR" == neoforge-1.21.1 ]]; then args+=(uuk-script-worker); fi
          python3 scripts/ci-test-report.py "${args[@]}"

      - name: Upload JUnit XML and HTML reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: regression-${{ matrix.platform }}
          path: |
            ${{ matrix.project }}/**/build/test-results/**/TEST-*.xml
            ${{ matrix.project }}/**/build/reports/tests/**
            ${{ matrix.worker-xml }}
            ${{ matrix.worker-html }}
          if-no-files-found: warn
          retention-days: 14

  web:
    name: Web and font tools
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Run Node tests and fixture checks
        working-directory: web
        run: |
          node --version
          npm test
      - name: Run four headless Chrome regression suites
        if: ${{ !cancelled() }}
        working-directory: web
        run: |
          npm run build
          status=0
          for suite in test:browser test:material-effects-browser test:rich-text-browser test:liquid-glass-browser; do
            echo "::group::$suite"
            npm run "$suite" || status=1
            echo "::endgroup::"
          done
          exit "$status"
      - name: Test Python font-pack tools
        if: ${{ !cancelled() }}
        run: python3 scripts/test-custom-font-pack.py -v
