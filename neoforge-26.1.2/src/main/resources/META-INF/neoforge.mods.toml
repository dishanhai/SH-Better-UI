license="MIT"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="cover.png"
authors="dishanhai"
description="Shared UI kernel and GUI library. NeoForge 26.1.2 alpha port."

[[mixins]]
config="sh_better_ui-26-blur.mixins.json"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="[${minecraft_version}]"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="kotlinforforge"
type="required"
versionRange="[${kff_version},)"
ordering="AFTER"
side="BOTH"
