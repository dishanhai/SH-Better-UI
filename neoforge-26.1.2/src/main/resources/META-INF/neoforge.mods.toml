[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="cover.png"
authors="dishanhai"
description="Shared UI kernel and GUI library. NeoForge 26.1.2 alpha port."

[[mixins]]
config="muonium.mixins.json"

[[mixins]]
config="sh_better_ui-26-blur.mixins.json"

[[mixins]]
config="sh_better_ui-26-text.mixins.json"

[[mixins]]
config="sh_better_ui-26-text-compat.mixins.json"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="[${minecraft_version}]"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="kotlinforforge"
type="required"
versionRange="[${kff_version},)"
ordering="AFTER"
side="BOTH"

[[dependencies.sh_better_ui]]
modId="muonium"
type="incompatible"
versionRange="[0,)"
ordering="NONE"
side="CLIENT"
reason="SH-Better-UI includes the MuoniumPlayer client."
