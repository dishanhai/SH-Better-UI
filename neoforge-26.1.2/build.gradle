// Author: dishanhai
plugins {
    id 'java-library'
    id 'com.gradleup.shadow' version '8.3.11'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'org.jetbrains.kotlin.jvm' version '2.3.10'
}

ext.portMixinConfigs = ['muonium.mixins.json', 'sh_better_ui-26-blur.mixins.json', 'sh_better_ui-26-text.mixins.json', 'sh_better_ui-26-text-compat.mixins.json']
apply from: '../gradle/neoforge-26-port.gradle'
apply from: '../gradle/muonium-neoforge.gradle'

// Optional integrations are compiled against pinned official artifacts, never bundled or required at runtime.
// 26.2 shares only the GuideME Java adapter, with a separate artifact and Mixin config.
sourceSets.main.java.srcDir('src/textCompat/java')
sourceSets.main.resources.srcDir('src/textCompat/resources')
repositories {
    maven {
        url = 'https://maven.ftb.dev/releases'
        content { includeGroup 'dev.ftb.mods' }
    }
}
configurations {
    textCompatArtifacts {
        canBeResolved = true
        canBeConsumed = false
        transitive = false
    }
}
configurations.compileOnly.extendsFrom(configurations.textCompatArtifacts)
configurations.testCompileOnly.extendsFrom(configurations.textCompatArtifacts)
sourceSets.test.java {
    srcDir('src/textCompatTest/java')
    include('com/dishanhai/sh_better_ui/client/compat/text26/**')
}
dependencies {
    textCompatArtifacts('org.appliedenergistics:guideme:26.1.17-beta') { transitive = false }
    textCompatArtifacts('dev.ftb.mods:ftb-library-neoforge:26.1.2.12') { transitive = false }
}

tasks.named('verifyLibraryJar') {
    doLast {
        new java.util.zip.ZipFile(tasks.jar.archiveFile.get().asFile).withCloseable { zip ->
            if (zip.entries().any { it.name.startsWith('guideme/') || it.name.startsWith('dev/ftb/') }) {
                throw new GradleException('Optional third-party implementation must not be bundled')
            }
        }
    }
}
