// Author: dishanhai
plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'org.jetbrains.kotlin.jvm' version '2.2.21'
}

group = 'com.dishanhai'
version = mod_version
base { archivesName = "${mod_id}-neoforge-${minecraft_version}" }
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
kotlin {
    jvmToolchain(21)
    compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21 }
}
repositories {
    mavenCentral()
    maven { url = 'https://thedarkcolour.github.io/KotlinForForge/' }
    maven { url = 'https://maven.blamejared.com/'; content { includeGroup 'mezz.jei' } }
    maven { url = 'https://maven.latvian.dev/releases/'; content { includeGroup 'dev.latvian.mods' } }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeModule 'maven.modrinth', 'ldlib' }
    }
}

// Share stable drawing and motion API; only loader/render entry points are overridden.
def platformFiles = ['com/dishanhai/sh_better_ui/ShBetterUi.java',
        'com/dishanhai/sh_better_ui/kernel/internal/live/network/PlatformLiveActivityNetwork.java',
        'com/dishanhai/sh_better_ui/kernel/internal/page/network/PlatformPageNetwork.java',
        'com/dishanhai/sh_better_ui/kernel/internal/page/container/PlatformPageMenus.java',
        'com/dishanhai/sh_better_ui/kernel/internal/richtext/network/PlatformRichSyncNetwork.java',
        'com/dishanhai/sh_better_ui/client/UiClient.java',
        'com/dishanhai/sh_better_ui/client/ForgePlatformBridge.java',
        'com/dishanhai/sh_better_ui/client/api/PlatformUiApi.java',
        'com/dishanhai/sh_better_ui/client/lyrics/LyricOptionsScreen.java',
        'com/dishanhai/sh_better_ui/client/lyrics/render/LyricGlyphPlatform.java',
        'com/dishanhai/sh_better_ui/compat/kubejs/ShBetterUiKubeJsPlugin.java',
        'com/dishanhai/sh_better_ui/client/blur/GaussBlur.java',
        'com/dishanhai/sh_better_ui/client/spatial/PlatformSpatialVertices.java',
        'com/dishanhai/sh_better_ui/client/gui/display/IconShaderRenderer.java',
        'com/dishanhai/sh_better_ui/client/gui/scaled/CapsuleRenderer.java',
        'com/dishanhai/sh_better_ui/client/gui/scaled/VisualRevealRenderer.java',
        'com/dishanhai/sh_better_ui/client/glass/GlassTooltip.java',
        'com/dishanhai/sh_better_ui/client/gui/selection/IngredientValues.java',
        'com/dishanhai/sh_better_ui/client/visual/RichInlinePlatform.java',
        'com/dishanhai/sh_better_ui/client/jei/JeiPlatformTooltip.java']
sourceSets {
    main {
        java.srcDir('../src/main/java')
        java.exclude { it.file.toPath().startsWith(file('../src/main/java').toPath()) &&
                platformFiles.contains(it.path) }
        resources.srcDir('../src/main/resources')
        resources.exclude('META-INF/mods.toml')
    }
    test {
        java.srcDir('../src/test/java')
        resources.srcDir('../src/test/resources')
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}
kotlin.sourceSets.main.kotlin {
    srcDir('../src/main/kotlin')
    exclude('**/compat/ldlib/**')
}

neoForge {
    version = neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods { sh_better_ui { sourceSet sourceSets.main } }
}
dependencies {
    implementation "thedarkcolour:kotlinforforge-neoforge:${kff_version}"
    compileOnly 'mezz.jei:jei-1.21.1-common-api:19.69.0.456'
    compileOnly('dev.latvian.mods:kubejs-neoforge:2101.7.2-build.381') { transitive = false }
    compileOnly('dev.latvian.mods:rhino:2101.2.7-build.81') { transitive = false }
    compileOnly('maven.modrinth:ldlib:mc1.21.1-2.2.44-neoforge') { transitive = false }
    // javac resolves LDLib2 LayoutStyle overloads that expose its bundled Yoga API.
    compileOnly('org.appliedenergistics.yoga:yoga:1.0.0') { transitive = false }
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.ow2.asm:asm:9.8'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    // Existing source-boundary tests resolve paths relative to the original source root.
    workingDir = projectDir.parentFile
}
ext.sourceRoot = projectDir.parentFile
apply from: '../gradle/kernel.gradle'

processResources {
    from('../LICENSE')
    inputs.property('mod_version', mod_version)
    inputs.property('neo_version', neo_version)
    filesMatching('META-INF/neoforge.mods.toml') { expand(mod_version: mod_version, neo_version: neo_version) }
    filesMatching('pack.mcmeta') {
        expand(mod_name: 'SH-Better-UI')
        filter { it.replace('"pack_format": 15', '"pack_format": 34') }
    }
}
jar {
    manifest.attributes('Implementation-Title': 'SH-Better-UI NeoForge',
            'Implementation-Version': project.version, 'Implementation-Vendor': 'dishanhai')
}
tasks.register('verifyLibraryJar') {
    dependsOn jar
    doLast {
        def archive = tasks.jar.archiveFile.get().asFile
        def zip = new java.util.zip.ZipFile(archive)
        try {
            ['META-INF/neoforge.mods.toml', 'com/dishanhai/sh_better_ui/ShBetterUi.class',
             'com/dishanhai/sh_better_ui/client/api/ShBetterUiApi.class',
             'com/dishanhai/sh_better_ui/client/api/PlatformUiApi.class',
             'com/dishanhai/sh_better_ui/client/api/PlatformUiApi$LdLib.class',
             'com/dishanhai/sh_better_ui/compat/kubejs/ShBetterUiKubeJsPlugin.class',
             'kubejs.plugins.txt', 'sh_better_ui.text.mixins.json', 'sh_better_ui.text_compat.mixins.json',
             'sh_better_ui.kernel.mixins.json',
             'com/dishanhai/sh_better_ui/client/blur/GaussBlur.class',
             'com/dishanhai/sh_better_ui/compat/ldlib2/LdLib2UiBridge.class',
             'assets/sh_better_ui/shaders/program/shop_gauss_blur.fsh',
             'assets/sh_better_ui/shaders/core/spatial.json',
             'assets/sh_better_ui/shaders/core/spatial.vsh',
             'assets/sh_better_ui/shaders/core/spatial.fsh'].each {
                if (zip.getEntry(it) == null) throw new GradleException("Missing library entry: ${it}")
            }
            if (zip.entries().any { it.name.contains('/kernel/smoke/') || it.name == 'META-INF/sh_better_ui.modules' }) {
                throw new GradleException('Kernel smoke fixtures must stay out of the release JAR')
            }
            def forbidden = zip.entries().findAll {
                it.name.startsWith('META-INF/jarjar/') || it.name.startsWith('kotlin/') ||
                it.name.startsWith('thedarkcolour/') || it.name.startsWith('com/dishanhai/gt_shanhai/') ||
                it.name.startsWith('com/dishanhai/sh_better_ui/compat/ldlib/') ||
                it.name.startsWith('com/lowdragmc/') ||
                it.name.startsWith('dev/latvian/') ||
                it.name.startsWith('org/appliedenergistics/yoga/') ||
                it.name.startsWith('mezz/jei/') || it.name == 'META-INF/mods.toml'
            }
            if (!forbidden.isEmpty()) throw new GradleException("Unexpected embedded entries: ${forbidden*.name}")
        } finally { zip.close() }
    }
}
tasks.named('build') { dependsOn 'verifyLibraryJar' }
