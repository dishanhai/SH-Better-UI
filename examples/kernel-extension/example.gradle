// Author: dishanhai
// Shared source and isolated packaged-client tasks for both example projects.
version = '1.0.0'
group = 'com.dishanhai'

sourceSets {
    main {
        java.srcDir('../common/src/main/java')
        resources.srcDir('../common/src/main/resources')
    }
    // The client loads both mods from JARs in its own mods folder.
    launcher
}
kotlin.sourceSets.main.kotlin.srcDir('../common/src/main/kotlin')
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(Jar).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

def library = project.ext.uiLibrary
def metadata = project.ext.loaderMetadata
dependencies { compileOnly files(library) }

def checkLibrary = tasks.register('verifyExampleDependency') {
    doLast {
        if (!library.isFile()) {
            throw new GradleException("Build SH-Better-UI first or set -PshBetterUiJar to the corresponding JAR. Missing: ${library}")
        }
        new java.util.zip.ZipFile(library).withCloseable { zip ->
            def required = [metadata, 'com/dishanhai/sh_better_ui/kernel/api/UnifiedUI.class',
                            'com/dishanhai/sh_better_ui/kernel/api/page/PageService.class',
                            'com/dishanhai/sh_better_ui/kernel/api/page/ServerPages.class']
            required += ['ActivityService', 'NotificationService', 'LiveSurfaceService'].collect {
                "com/dishanhai/sh_better_ui/kernel/api/live/${it}.class"
            }
            required += ['com/dishanhai/sh_better_ui/client/visual/RichTextView.class',
                         'com/dishanhai/sh_better_ui/client/visual/RichTextExtensions.class',
                         'com/dishanhai/sh_better_ui/kernel/api/richtext/RichDocumentCodec.class',
                         'com/dishanhai/sh_better_ui/kernel/api/project/ProjectEdits.class',
                         'com/dishanhai/sh_better_ui/kernel/api/render/RenderGraph.class',
                         'com/dishanhai/sh_better_ui/kernel/api/geometry/FilledGeometry.class',
                         'com/dishanhai/sh_better_ui/kernel/api/text/TextReadabilityService.class',
                         'com/dishanhai/sh_better_ui/kernel/api/page/UiPageTextReadability.class']
            if (required.any { zip.getEntry(it) == null }) {
                throw new GradleException("Incompatible SH-Better-UI JAR: ${library}")
            }
        }
    }
}
tasks.named('compileJava') { dependsOn checkLibrary }
tasks.named('compileKotlin') { dependsOn checkLibrary }

project.ext.verifyArchive = { File archive ->
    new java.util.zip.ZipFile(archive).withCloseable { zip ->
        def required = [metadata, 'pack.mcmeta', 'META-INF/sh_better_ui.modules',
                        'com/dishanhai/shbui_kernel_example/ExampleUiModule.class',
                        'com/dishanhai/shbui_kernel_example/LiveActivityExamples.class',
                        'com/dishanhai/shbui_kernel_example/LiveExamplesSmoke.class',
                        'com/dishanhai/shbui_kernel_example/ConnectionExample.class',
                        'com/dishanhai/shbui_kernel_example/CraftingBackend.class']
        required += ['com/dishanhai/shbui_kernel_example/CorrectnessExamples.class',
                     'com/dishanhai/shbui_kernel_example/RichTextSdkScreen.class',
                     'com/dishanhai/shbui_kernel_example/RichTextSdkSmoke.class',
                     'com/dishanhai/shbui_kernel_example/TextReadabilitySdkScreen.class',
                     'com/dishanhai/shbui_kernel_example/TextReadabilityKotlinExample.class',
                     'assets/shbui_kernel_example/rich_text/guide.json',
                     'com/dishanhai/shbui_kernel_example/ClientPageExamples.class',
                     'com/dishanhai/shbui_kernel_example/ExampleServerPages.class',
                     'com/dishanhai/shbui_kernel_example/ExchangePage.class',
                     'com/dishanhai/shbui_kernel_example/exchange.properties']
        required += ['en_us', 'zh_cn', 'zh_tw'].collect { "assets/shbui_kernel_example/lang/${it}.json" }
        def missing = required.findAll { zip.getEntry(it) == null }
        if (missing) throw new GradleException("Example JAR missing ${missing}")
        def embedded = zip.entries().any {
            it.name.startsWith('com/dishanhai/sh_better_ui/') || it.name.startsWith('assets/sh_better_ui/')
                    || it.name.startsWith('META-INF/jarjar/')
        }
        if (embedded) throw new GradleException('The example JAR must keep dependencies external')
    }
}

boolean smoke = providers.gradleProperty('exampleSmoke').isPresent()
def run = layout.buildDirectory.dir(smoke ? 'example-smoke' : 'example-client').get().asFile
project.ext.exampleRun = run
project.ext.exampleSmoke = smoke

def stageMods = tasks.register('stageExampleMods', Copy) {
    dependsOn checkLibrary
    into new File(run, 'mods')
    from(project.ext.exampleLaunchArchive) { rename { 'shbui_kernel_example.jar' } }
    from(library) { rename { 'sh_better_ui.jar' } }
    if (project.ext.has('kotlinMod')) {
        File kotlinJar = project.ext.kotlinMod
        from(kotlinJar) { rename { 'kotlinforforge.jar' } }
        doFirst {
            if (!kotlinJar.isFile()) throw new GradleException("Missing KotlinForForge JAR: ${kotlinJar}")
        }
    }
}
tasks.matching { it.name == 'runClient' }.configureEach {
    dependsOn stageMods
    if (smoke) {
        def outputs = ['success.txt', 'stopped.txt', 'screen.png', 'rich-text.png', 'rich-text-reloaded.png',
                       'text-readability.png']
        doFirst {
            outputs.each { java.nio.file.Files.deleteIfExists(new File(run, it).toPath()) }
            new File(run, 'options.txt').setText('onboardAccessibility:false\nguiScale:2\n', 'UTF-8')
        }
        doLast {
            if (!outputs.every { new File(run, it).isFile() }) {
                throw new GradleException("The packaged extension did not finish its smoke checks. See ${run}")
            }
        }
    }
}
