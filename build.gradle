// Author: dishanhai
import java.security.MessageDigest

buildscript {
    repositories { maven { url = 'https://repo.spongepowered.org/repository/maven-public/' } }
    dependencies { classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT' }
}
plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.jetbrains.kotlin.jvm' version '2.2.21'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}
apply plugin: 'org.spongepowered.mixin'

group = 'com.dishanhai'
version = mod_version
base { archivesName = mod_id }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}
kotlin {
    jvmToolchain(21)
    compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17 }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
tasks.named('compileTestJava', JavaCompile) { options.release = 21 }
repositories {
    mavenCentral()
    ivy {
        name = 'ModernUI official GitHub release'
        url = 'https://github.com/BloCamLimb/ModernUI-MC/releases/download/'
        patternLayout { artifact '[revision]/[module]-1.20.1-3.12.0.1-universal.[ext]' }
        metadataSources { artifact() }
        content { includeGroup 'official.modernui.release' }
    }
    maven { url = 'https://maven.maxhenkel.de/repository/public'; content { includeGroup 'de.maxhenkel.voicechat' } }
    maven { url = 'https://maven.blamejared.com/'; content { includeGroup 'mezz.jei' } }
    maven { url = 'https://maven.latvian.dev/releases/'; content { includeGroup 'dev.latvian.mods' } }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // KotlinForForge is installed separately. Never unpack or embed its classes.
    implementation files('libs/kotlinforforge-4.12.0-all.jar')
    compileOnly files('libs/ldlib-forge-1.20.1-1.0.33.b.jar')
    compileOnly fg.deobf('mezz.jei:jei-1.20.1-common-api:15.49.0.200')
    compileOnly('dev.latvian.mods:kubejs-forge:2001.6.5-build.26') { transitive = false }
    compileOnly('dev.latvian.mods:rhino-forge:2001.2.3-build.10') { transitive = false }
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly 'org.jetbrains:annotations:20.1.0'
    compileOnly 'de.maxhenkel.voicechat:voicechat-api:2.6.27'
    jarJar('com.google.zxing:core:[3.5.3,3.6)') { jarJar.pin(it, '3.5.3') }
    jarJar('io.github.humbleui:types:[0.2.0,1.0)') { jarJar.pin(it, '0.2.0') }
    jarJar('io.github.humbleui:skija-shared:[0.143.17,0.144)') { jarJar.pin(it, '0.143.17') }
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'io.github.humbleui:types:0.2.0'
    implementation 'io.github.humbleui:skija-shared:0.143.17'
    runtimeOnly 'io.github.humbleui:skija-windows-x64:0.143.17'
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

configurations { muoniumRhino; muoniumDevLibraries; muoniumModernUi }
dependencies { muoniumRhino 'org.mozilla:rhino:1.7.15' }
dependencies {
    muoniumDevLibraries 'com.google.zxing:core:3.5.3'
    muoniumDevLibraries 'io.github.humbleui:types:0.2.0'
    muoniumDevLibraries 'io.github.humbleui:skija-shared:0.143.17'
    muoniumModernUi 'official.modernui.release:ModernUI-Forge:3.12.0.4'
    compileOnly files(configurations.muoniumModernUi)
}
def verifyMuoniumModernUi = tasks.register('verifyMuoniumModernUi') {
    inputs.files configurations.muoniumModernUi
    doLast {
        def artifact = configurations.muoniumModernUi.singleFile
        def digest = MessageDigest.getInstance('SHA-256')
        artifact.withInputStream { input ->
            byte[] buffer = new byte[16384]
            int length
            while ((length = input.read(buffer)) != -1) digest.update(buffer, 0, length)
        }
        def actual = digest.digest().collect { String.format('%02x', it & 0xff) }.join()
        if (actual != '49fea599522316ef7abd8897e8bcad3ed742d935f0a53726eba1f00c9ca8fe4c') {
            throw new GradleException('ModernUI Forge release checksum mismatch')
        }
    }
}
tasks.named('compileJava') { dependsOn verifyMuoniumModernUi }
tasks.named('compileKotlin') { dependsOn verifyMuoniumModernUi }
def relocateMuoniumRhino = tasks.register('relocateMuoniumRhino', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    destinationDirectory.set(layout.buildDirectory.dir('tmp/muonium-rhino'))
    archiveClassifier = 'muonium-rhino'
    configurations = [project.configurations.muoniumRhino]
    exclude 'META-INF/MANIFEST.MF', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'module-info.class'
    relocate 'org.mozilla.javascript', 'muonium.rhino'
    relocate 'org.mozilla.classfile', 'muonium.rhino.classfile'
}
dependencies { implementation files(relocateMuoniumRhino) }
def shadeMuoniumDevLibraries = tasks.register('shadeMuoniumDevLibraries', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    destinationDirectory.set(layout.buildDirectory.dir('tmp/muonium-dev-libraries'))
    archiveClassifier = 'muonium-dev-libraries'
    configurations = [project.configurations.muoniumDevLibraries]
    exclude 'META-INF/MANIFEST.MF', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'module-info.class'
}
def flattenMuoniumDevLibraries = tasks.register('flattenMuoniumDevLibraries', Jar) {
    dependsOn shadeMuoniumDevLibraries
    destinationDirectory.set(layout.buildDirectory.dir('tmp/muonium-dev-flattened'))
    archiveClassifier = 'muonium-dev-flattened'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from({ zipTree(shadeMuoniumDevLibraries.get().archiveFile) }) {
        include 'META-INF/versions/**'
        exclude '**/module-info.class'
        eachFile { it.path = it.path.replaceFirst('^META-INF/versions/\\d+/', '') }
    }
    from({ zipTree(shadeMuoniumDevLibraries.get().archiveFile) }) { exclude 'META-INF/versions/**' }
}
tasks.named('classes') {
    dependsOn flattenMuoniumDevLibraries
    doLast {
        copy {
            from zipTree(flattenMuoniumDevLibraries.get().archiveFile)
            from zipTree(relocateMuoniumRhino.get().archiveFile)
            into tasks.named('compileJava', JavaCompile).get().destinationDirectory.get().asFile
            includeEmptyDirs = false
            duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        }
    }
}
// Production classes retain Java 17 bytecode compatibility; verification runs on Java 21.
tasks.named('compileTestJava', JavaCompile) {
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(21) }
}
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
}

// Reuse the verified metadata cache instead of fetching it on every configuration.
def cachedMcVersionJson = file("${System.properties['user.home']}/.gradle/caches/forge_gradle/minecraft_repo/versions/${minecraft_version}/version.json")
def mcMetaOut = layout.buildDirectory.file('downloadMCMeta/version.json').get().asFile
if (cachedMcVersionJson.isFile() && !mcMetaOut.isFile()) {
    mcMetaOut.parentFile.mkdirs()
    java.nio.file.Files.copy(cachedMcVersionJson.toPath(), mcMetaOut.toPath())
}

def mixinConfigs = ['sh_better_ui.text.mixins.json', 'sh_better_ui.text_compat.mixins.json',
                    'sh_better_ui.kernel.mixins.json', 'sh_better_ui.forge.render.mixins.json',
                    'muonium.mixins.json']

jarJar.enable()
minecraft {
    accessTransformer = file('src/muonium-forge/resources/META-INF/accesstransformer.cfg')
    mappings channel: mappings_channel, version: "${mappings_version}-${minecraft_version}"
    runs {
        client {
            workingDirectory file('run/client')
            args mixinConfigs.collectMany { ['--mixin', it] }
            mods { sh_better_ui { source sourceSets.main } }
        }
        server {
            workingDirectory file('run/server')
            mods { sh_better_ui { source sourceSets.main } }
        }
    }
}

sourceSets.main {
    java.srcDirs 'src/muonium/java', 'src/muonium-forge/java', 'src/muonium-forge/modernui', 'src/uuk-muonium/java'
    kotlin.srcDirs 'src/muonium/kotlin', 'src/muonium-forge/kotlin', 'src/uuk-muonium/kotlin'
    resources.srcDirs 'src/muonium/resources', 'src/muonium-forge/resources', 'src/uuk-muonium/resources'
}
mixin { add sourceSets.main, 'muonium.refmap.json' }
// MixinGradle attaches its refmap task to every Jar, including the Rhino
// relocation input to compileJava. That archive contains no mod mixins.
afterEvaluate {
    tasks.named('addMixinsToRelocateMuoniumRhino') { setDependsOn([]) }
}

ext.sourceRoot = projectDir
apply from: 'gradle/kernel.gradle'

// ForgeGradle's exploded mod roots must include Kotlin's separate output directory.
tasks.withType(JavaExec).matching { it.name in ['runClient', 'runServer'] }.configureEach {
    doFirst {
        def roots = sourceSets.main.output.files.findAll { it.isDirectory() }
        environment 'MOD_CLASSES', roots.collect { "${mod_id}%%${it.absolutePath}" }.join(File.pathSeparator)
    }
}

processResources {
    from('LICENSE')
    filteringCharset = 'UTF-8'
    def properties = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
                      mod_authors: mod_authors, mod_description: mod_description,
                      minecraft_version: minecraft_version, forge_version: forge_version]
    inputs.properties properties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand properties }
}

jar {
    archiveClassifier = 'raw'
    exclude 'io/github/humbleui/**/*.class', 'com/google/zxing/**'
    manifest.attributes('Specification-Title': mod_name,
                        'Specification-Vendor': mod_authors,
                        'Specification-Version': '1',
                        'Implementation-Title': mod_name,
                        'Implementation-Version': mod_version,
                        'Implementation-Vendor': mod_authors,
                        'MixinConfigs': mixinConfigs.join(','))
    finalizedBy 'reobfJar'
}

tasks.named('jarJar', Jar) {
    dependsOn relocateMuoniumRhino
    exclude 'io/github/humbleui/**/*.class', 'com/google/zxing/**'
    manifest.attributes('MixinConfigs': mixinConfigs.join(','))
}
reobf { jarJar {} }

// Keep development classes independent of ForgeGradle's production remapping.
tasks.register('devJar', Jar) {
    dependsOn classes
    archiveClassifier = 'dev'
    from sourceSets.main.output
    exclude 'io/github/humbleui/**/*.class', 'com/google/zxing/**'
    manifest.attributes('MixinConfigs': mixinConfigs.join(','))
}
def releaseJarName = "${mod_id}-forge-${minecraft_version}-${mod_version}.jar"
tasks.register('releaseJar', Copy) {
    dependsOn 'reobfJarJar'
    mustRunAfter 'reobfJar', 'compileTestJava', 'test'
    from layout.buildDirectory.file('reobfJarJar/output.jar')
    into layout.buildDirectory.dir('libs')
    rename { releaseJarName }
}

tasks.register('verifyLibraryJar') {
    dependsOn 'releaseJar'
    doLast {
        def artifact = layout.buildDirectory.file("libs/${releaseJarName}").get().asFile
        def zip = new java.util.zip.ZipFile(artifact)
        try {
            def required = ['META-INF/licenses/muoniumplayer/LICENSE',
                            'META-INF/licenses/muoniumplayer/NOTICE',
                            'META-INF/licenses/muoniumplayer/CHANGES.txt',
                            'META-INF/mods.toml', 'pack.mcmeta', 'kubejs.plugins.txt',
                            'com/dishanhai/sh_better_ui/ShBetterUi.class',
                            'com/dishanhai/sh_better_ui/client/UiClient.class',
                            'com/dishanhai/sh_better_ui/client/blur/GaussBlur.class',
                            'assets/sh_better_ui/shaders/post/shop_gauss_blur.json',
                            'assets/sh_better_ui/shaders/program/shop_gauss_blur.json',
                            'assets/sh_better_ui/shaders/program/shop_gauss_blur.fsh',
                            'assets/sh_better_ui/shaders/program/shop_gauss_blur.vsh',
                            'assets/sh_better_ui/shaders/core/spatial.json',
                            'assets/sh_better_ui/shaders/core/spatial.vsh',
                            'assets/sh_better_ui/shaders/core/spatial.fsh',
              'com/dishanhai/sh_better_ui/kernel/api/text/TextReadabilityService.class',
              'com/dishanhai/sh_better_ui/kernel/api/text/TextReadabilityService$ClusterDiagnostic.class',
              'com/dishanhai/sh_better_ui/kernel/api/page/UiPageTextReadability.class',
              'assets/sh_better_ui/shaders/text_readability.vsh',
              'assets/sh_better_ui/shaders/text_readability_sample.fsh',
              'assets/sh_better_ui/shaders/text_readability_decide.fsh',
              'assets/sh_better_ui/shaders/text_readability_composite.fsh'] + mixinConfigs
            sourceSets.main.output.classesDirs.files.each { classesDir ->
                fileTree(classesDir).matching {
                    include '**/*.class'
                    exclude 'io/github/humbleui/**', 'com/google/zxing/**'
                }.files.each { classFile ->
                    required.add(classesDir.toPath().relativize(classFile.toPath()).toString().replace('\\', '/'))
                }
            }
            def missing = required.findAll { zip.getEntry(it) == null }
            if (!missing.isEmpty()) throw new GradleException("UI library entries missing: ${missing}")
            if (zip.entries().any { it.name.contains('/kernel/smoke/') || it.name == 'META-INF/sh_better_ui.modules' }) {
                throw new GradleException('Kernel smoke fixtures must stay out of the release JAR')
            }
            def forbidden = zip.entries().findAll {
                it.name.startsWith('kotlin/') ||
                it.name.startsWith('kotlinx/') || it.name.startsWith('thedarkcolour/') ||
                it.name.startsWith('com/dishanhai/gt_shanhai/') || it.name.startsWith('mezz/jei/') ||
                it.name.startsWith('dev/latvian/')
            }.collect { it.name }
            if (!forbidden.isEmpty()) throw new GradleException("UI library contains embedded dependency classes: ${forbidden.take(5)}")
        } finally { zip.close() }
    }
}
tasks.named('build') { dependsOn 'devJar', 'verifyLibraryJar' }

ext.skijaReleaseArchive = layout.buildDirectory.file("libs/${releaseJarName}")
apply from: 'gradle/skija-release.gradle'

publishing {
    publications {
        uiLibrary(MavenPublication) {
            artifactId = mod_id
            artifact tasks.named('devJar')
            artifact tasks.named('sourcesJar')
            pom {
                name = mod_name
                description = mod_description
            }
        }
    }
}
