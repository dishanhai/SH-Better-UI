repositories {
    mavenCentral()
    maven {
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
        content { includeGroup 'thedarkcolour' }
    }
}

neoForge {
    version = neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods { sh_better_ui { sourceSet sourceSets.main } }
}

dependencies {
    implementation "thedarkcolour:kotlinforforge-neoforge:${kff_version}"
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('test', Test) {
    useJUnitPlatform()
    systemProperty 'shbui.examples.compileClasspath', sourceSets.test.runtimeClasspath.asPath
    inputs.file('../docs/NEOFORGE_26_GALLERY_GAPS.md')
}
ext.sourceRoot = projectDir.parentFile
apply from: '../gradle/kernel.gradle'

processResources {
    from('../LICENSE')
    from('../src/main/resources') {
        include('cover.png', 'assets/sh_better_ui/lang/**', 'assets/sh_better_ui/textures/gui/display*/**',
                'assets/sh_better_ui/font/hud_shortcut_keycaps.json', 'assets/sh_better_ui/textures/font/hud_shortcut_keycaps.png',
                'assets/sh_better_ui/font/inline_items.json',
                'assets/sh_better_ui/font/mp_ui.json', 'assets/sh_better_ui/font/mp_ui_semibold.json',
                'assets/sh_better_ui/font/sh_sans_ui.ttf', 'assets/sh_better_ui/font/sh_sans_ui_semibold.ttf',
                'assets/sh_better_ui/textures/gui/rich/**',
                'assets/sh_better_ui/music/apple-login/**',
                'assets/sh_better_ui/shaders/include/rich_icon_effects.glsl',
                'META-INF/third-party/**', 'META-INF/licenses/**')
    }
    def metadata = [mod_version: version, mod_id: modId, mod_name: modName, minecraft_version: minecraft_version,
                    neo_version: neo_version, kff_version: kff_version]
    inputs.properties(metadata)
    filesMatching('META-INF/neoforge.mods.toml') { expand(metadata) }
}

