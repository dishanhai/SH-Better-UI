sourceSets.main.java {
    srcDir(sharedJava)
    exclude { entry ->
        // Native 26.x replacements must win over shared legacy renderer classes.
        if (!entry.isDirectory() && entry.file.toPath().startsWith(sharedJava.toPath()) &&
                new File(file('../neoforge-26.1.2/src/main/java'), entry.path).isFile()) return true
        !entry.isDirectory() && entry.file.toPath().startsWith(sharedJava.toPath()) &&
                !sharedSources.contains(entry.path) && !entry.path.startsWith("${packagePath}/theme/") &&
                !entry.path.startsWith("${packagePath}/kernel/api/dock/indicator/") &&
                !entry.path.startsWith("${packagePath}/kernel/api/music/") &&
                !entry.path.startsWith("${packagePath}/kernel/internal/music/") &&
                !entry.path.startsWith("${packagePath}/client/lyrics/core/capability/")
    }
}
