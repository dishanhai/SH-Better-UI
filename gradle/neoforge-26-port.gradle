// Author: dishanhai
def modProperties = new Properties()
file('../gradle.properties').withInputStream { modProperties.load(it) }
def modId = modProperties.getProperty('mod_id')
def modName = modProperties.getProperty('mod_name')
def portMixinConfigs = project.findProperty('portMixinConfigs') ?: []
group = 'com.dishanhai'
version = "${modProperties.getProperty('mod_version')}-alpha.8"
base { archivesName = "${modId}-neoforge-${minecraft_version}" }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
kotlin { jvmToolchain(25) }

def sharedJava = file('../src/main/java')
def packagePath = 'com/dishanhai/sh_better_ui'
