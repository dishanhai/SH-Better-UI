].collect { "${packagePath}/${it}".toString() }.toSet()
sourceSets.main.java {
    srcDir(sharedJava)
    exclude { entry ->
        !entry.isDirectory() && entry.file.toPath().startsWith(sharedJava.toPath()) &&
                !sharedSources.contains(entry.path) && !entry.path.startsWith("${packagePath}/theme/")
    }
}
kotlin.sourceSets.main.kotlin {
    srcDir('../src/main/kotlin')
    include("${packagePath}/kernel/api/page/PageDsl.kt")
}
sourceSets.test {
    java {
        srcDir('../src/test/java')
        include("${packagePath}/client/gui/search/SearchIndexTest.java")
        include("${packagePath}/client/gui/scaled/ButtonFeedbackTest.java")
        include("${packagePath}/client/gui/scaled/InterruptibleAnimationTest.java")
        include("${packagePath}/client/gui/scaled/SpringTableTest.java")
        include("${packagePath}/client/gui/scaled/UiAttentionTest.java")
        include("${packagePath}/client/gui/scaled/TabScrollStateTest.java")
        include("${packagePath}/client/gui/scaled/UiTimelineTest.java")
        include("${packagePath}/client/gui/scaled/*InputTest.java")
        include("${packagePath}/client/gui/panel/ControlPanelSettingsTest.java")
        include("${packagePath}/client/gui/panel/GalleryExamplesTest.java")
        include("${packagePath}/client/gui/panel/DeveloperPreviewRegistryTest.java")
        include("${packagePath}/client/api/preview/PreviewRegistryTest.java")
    }
    compileClasspath += sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.runtimeClasspath
}

repositories {
    mavenCentral()
    maven {
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
        content { includeGroup 'thedarkcolour' }
    }
}

neoForge {
    version = neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods { sh_better_ui { sourceSet sourceSets.main } }
}

dependencies {
    implementation "thedarkcolour:kotlinforforge-neoforge:${kff_version}"
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('test', Test) {
    useJUnitPlatform()
    systemProperty 'shbui.examples.compileClasspath', sourceSets.test.runtimeClasspath.asPath
    inputs.file('../docs/NEOFORGE_26_GALLERY_GAPS.md')
}
ext.sourceRoot = projectDir.parentFile
apply from: '../gradle/kernel.gradle'

processResources {
    from('../LICENSE')
    from('../src/main/resources') {
        include('cover.png', 'assets/sh_better_ui/lang/**', 'assets/sh_better_ui/textures/gui/display*/**',
                'META-INF/third-party/**')
    }
    def metadata = [mod_version: version, mod_id: modId, mod_name: modName, minecraft_version: minecraft_version,
                    neo_version: neo_version, kff_version: kff_version]
    inputs.properties(metadata)
    filesMatching('META-INF/neoforge.mods.toml') { expand(metadata) }
}

tasks.register('verifyLibraryJar') {
    dependsOn tasks.named('jar')
    doLast {
        def archive = tasks.jar.archiveFile.get().asFile
        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            ([
                    'META-INF/neoforge.mods.toml',
                    "${packagePath}/ShBetterUi.class",
                    "${packagePath}/client/api/ShBetterUiApi.class",
                    "${packagePath}/client/api/ControlsApi.class",
                    "${packagePath}/client/api/BlurApi.class",
                    "${packagePath}/client/api/SettingsApi.class",
                    "${packagePath}/client/api/UiClientApi.class",
                    "${packagePath}/client/api/UiFrame.class",
                    "${packagePath}/client/api/preview/PreviewRegistry.class",
                    "${packagePath}/client/api/preview/PreviewSpec.class",
                    "${packagePath}/client/api/preview/PreviewScene.class",
                    "${packagePath}/client/api/preview/PreviewContext.class",
                    "${packagePath}/client/blur/BackdropCapture.class",
                    "${packagePath}/client/blur/BackgroundBlur.class",
                    "${packagePath}/client/glass/LiquidGlassSurface.class",
                    "${packagePath}/client/gui/panel/ControlPanelScreen.class",
                    "${packagePath}/client/gui/panel/PanelOverview.class",
                    "${packagePath}/client/gui/panel/DeveloperPanelScreen.class",
                    "${packagePath}/client/gui/panel/DeveloperGalleryScreen.class",
                    "${packagePath}/client/gui/panel/GalleryExtensionScreen.class",
                    "${packagePath}/client/gui/panel/GalleryMaterialPipeline.class",
                    "${packagePath}/client/gui/panel/GalleryAppearanceSamples.class",
                    "${packagePath}/client/gui/panel/GalleryDynamicThemeSample.class",
                    "${packagePath}/client/gui/panel/GalleryFieldSamples.class",
                    "${packagePath}/client/gui/panel/GalleryLiveActivitySample.class",
                    "${packagePath}/client/gui/panel/GalleryMusicSamples.class",
                    "${packagePath}/client/gui/panel/GallerySpatialSamples.class",
                    'assets/sh_better_ui/shaders/core/liquid_glass.vsh',
                    'assets/sh_better_ui/shaders/core/liquid_glass.fsh',
                    'assets/sh_better_ui/shaders/core/gallery_material.vsh',
                    'assets/sh_better_ui/shaders/core/gallery_material.fsh',
                    'assets/sh_better_ui/shaders/core/gallery_spatial.vsh',
                    'assets/sh_better_ui/shaders/core/gallery_spatial.fsh',
                    'assets/sh_better_ui/shaders/core/gallery_spatial_reveal.fsh',
                    "${packagePath}/client/gui/display/GraphicIcon.class",
                    "${packagePath}/client/gui/scaled/UiButton.class",
                    "${packagePath}/client/gui/scaled/UiToggleButton.class",
                    "${packagePath}/client/gui/scaled/UiSlider.class",
                    "${packagePath}/client/gui/scaled/UiStepper.class",
                    "${packagePath}/client/gui/scaled/UiSectionBar.class",
                    "${packagePath}/client/gui/scaled/UiScrollableSectionBar.class",
                    "${packagePath}/client/gui/scaled/UiUnderlinedTabs.class",
                    "${packagePath}/client/gui/scaled/UiDisclosure.class",
                    "${packagePath}/client/spatial/GuiGeometry.class",
                    "${packagePath}/client/gui/search/SearchIndex.class",
                    "${packagePath}/kernel/api/UnifiedUI.class",
                    "${packagePath}/kernel/api/UIApis.class",
                    "${packagePath}/kernel/api/ScreenService.class",
                    "${packagePath}/kernel/api/HudService.class",
                    "${packagePath}/kernel/api/text/TextReadabilityService.class",
                    "${packagePath}/kernel/internal/ClientTextReadability.class",
                    "${packagePath}/client/blur/mixin/GuiRendererReadbackMixin.class",
                    "${packagePath}/kernel/api/page/PageDslKt.class",
                    'assets/sh_better_ui/material_catalog/catalog.json'
            ] + portMixinConfigs).each { entry ->
                if (zip.getEntry(entry) == null) throw new GradleException("Missing library entry: ${entry}")
            }
            def forbidden = zip.entries().findAll { entry ->
                entry.name == 'META-INF/mods.toml' ||
                        (entry.name.endsWith('.mixins.json') && !portMixinConfigs.contains(entry.name)) ||
                        entry.name.startsWith('META-INF/jarjar/') || entry.name.startsWith('kotlin/') ||
                        entry.name.startsWith('thedarkcolour/')
            }
            if (!forbidden.isEmpty()) throw new GradleException("Unexpected packaged entries: ${forbidden*.name}")
        }
    }
}
tasks.named('build') { dependsOn 'verifyLibraryJar' }
